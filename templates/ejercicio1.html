<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Cálculo de compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="card">
        <h2>Calculo de compras</h2>
        <form method="POST">
            <div class="form-group">
                <label for="nombre">Ingresa tu nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="edad">Ingresa tu edad</label>
                <input type="number" id="edad" name="edad" min="0" required>
            </div>

            <div class="form-group">
                <label for="tarros">Ingresa la cantidad de tarros de pintura a comprar</label>
                <input type="number" id="tarros" name="tarros" min="1" required>
            </div>

            <button type="submit" class="btn-action">Calcular</button>
        </form>

        {% if resultado %}
        <div class="resultado">
            <p>Nombre del cliente: {{ resultado.nombre }}</p>
            <p>Total sin descuento: ${{ resultado.total_sin_descuento }}</p>
            <p>El descuento es : ${{ resultado.descuento }}</p>
            <p>El total a pagar es de : ${{ resultado.total_pagar }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
